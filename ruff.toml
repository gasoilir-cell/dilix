# پیکربندی‌ی ruff برای کلِ مخزن. CI با `ruff check backend/` و
# `ruff format --check backend/` از ریشه اجرا می‌شود، پس تنظیمات باید اینجا باشد
# (فایلِ `pyproject.toml`ِ هر سرویس فقط روی فایل‌های خودش اثر دارد).

line-length = 100
target-version = "py312"

[lint.per-file-ignores]
# مدل‌ها عمداً *پس از* ساختِ `app` وارد می‌شوند تا `Base.metadata` پیش از
# `create_all` پر شده باشد. جابه‌جا کردنشان به بالا ترتیبِ لازم را می‌شکند.
"backend/services/api/app/main.py" = ["E402"]

[format]
# سرویسِ زنده‌ی `api` همان‌طور که بود وارد مخزن شد. قالب‌بندیِ خودکارِ آن
# ۱۰۴ فایل را یک‌جا بازنویسی می‌کند — هم diffهای واقعی را زیرِ نویز دفن می‌کند و
# هم ستون‌بندیِ دستیِ مدل‌ها (`id          = Column(...)`) را که عمدی و خواناست
# از بین می‌برد. تا زمانِ مهاجرت به `core`، فقط `ruff check` روی آن اعمال می‌شود.
exclude = ["backend/services/api/**"]
