name: dilix_mobile
description: Dilix — Super-App (Flutter, mobile-first, RTL، چندزبانه)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.2 # باید با نسخهٔ pinِ flutter_localizations در Flutter SDK هماهنگ باشد
  shared_preferences: ^2.3.2 # پایداریِ نشست (access/refresh token) بین اجراها
  # ورودِ اجتماعی (بومی)
  flutter_appauth: ^8.0.0 # Google/Microsoft/Apple via OIDC (PKCE)
  flutter_facebook_auth: ^7.1.1 # Facebook access_token
  # تماسِ صوتی/تصویری (WebRTC) — signaling روی WS /v1/ws، relay سمتِ سرور
  flutter_webrtc: ^0.12.3
  # پخشِ ویدیو برای فیدِ Reels
  video_player: ^2.9.2
  # انتخابِ تصویر/ویدیو از گالریِ گوشی برای انتشارِ پستِ فید
  image_picker: ^1.1.2
  # ضبطِ پیامِ صوتیِ گفتگو (خروجیِ AAC/m4a). مجوزِ RECORD_AUDIO از مانیفستِ خودِ
  # پلاگین با manifest-merger ادغام می‌شود، پس CI نیازی به patchِ مانیفست ندارد.
  # ⚠ خطِ ۵.x قابلِ استفاده نیست: pub در آن `record_linux 0.7.2` را با
  # `record_platform_interface 1.6.0` جفت می‌کند و کامپایلِ Dart می‌شکند
  # («RecordLinux is missing implementations»). خطِ ۷.x مجموعهٔ federatedِ ۲.x
  # سازگار دارد.
  record: ^7.0.0
  # مسیرِ موقتِ دستگاه برای فایلِ صوتیِ ضبط‌شده
  path_provider: ^2.1.0
  # GPS برای ثبتِ موقعیتِ خودم روی کره، ارسالِ موقعیت در چت و موقعیتِ زنده.
  # APIهای مصرف‌شده (`getCurrentPosition(locationSettings:)`، `checkPermission`،
  # `LocationPermission`) از ۱۰.x تا ۱۴.x پایدارند؛ روی ۱۳.x قفل شد تا مثلِ
  # `record` گرفتارِ خطِ نسخهٔ ناسازگار نشویم. مجوزهای ACCESS_*_LOCATION از
  # بستهٔ محلیِ `dilix_permissions` می‌آیند (پایین).
  geolocator: ^13.0.0
  # بستهٔ محلیِ بدونِ کد؛ تنها کارش merge شدنِ مجوزهای موقعیت در مانیفستِ نهایی
  # است. چرا اینجا و نه مانیفستِ اپ؟ CI با `rm -rf android && flutter create`
  # اسکفولد را از صفر می‌سازد، پس مانیفستِ commit‌شده پاک می‌شود؛ ولی مانیفستِ
  # ماژولِ پلاگین همیشه merge می‌شود (اثباتِ عملی: RECORD_AUDIO از پلاگینِ record).
  dilix_permissions:
    path: packages/dilix_permissions
  # انتخابِ فایلِ دلخواه (سند/PDF/…) برای پیوستِ گفتگو — سرور نوعِ `file` را می‌پذیرد
  file_picker: ^8.0.0
  # اسکنِ کدِ QRِ پرداخت با دوربین (CameraX + ML Kit روی اندروید).
  # مجوزِ CAMERA و `uses-feature` را خودِ مانیفستِ پلاگین اعلام می‌کند، پس برخلافِ
  # geolocator چیزی به `dilix_permissions` اضافه نشد.
  # ⚠ عمداً روی خطِ ۶.x قفل است، نه ۷.x: خطِ ۷ کفِ minSdk را ۲۳ می‌کند و
  # manifest-merger با minSdk=21ِ تنظیم‌شده در `.github/workflows/mobile.yml`
  # می‌شکند. ارتقا به ۷.x باید هم‌زمان با تغییرِ همان مقدار در ورک‌فلو انجام شود.
  mobile_scanner: ^6.0.10
  # نمای وبِ Dilix داخلِ تب‌های «کره» و «پیام‌ها» (رندرِ روی دستگاه، نه اتوماسیونِ مرورگر)
  webview_flutter: ^4.10.0
  # پیاده‌سازیِ اندرویدِ WebView برای مجوزهایِ دوربین/میکروفن/موقعیت و انتخابِ فایل
  webview_flutter_android: ^4.1.0

# `pubspec.lock` در ریپو نیست، پس هر بیلدِ CI از نو resolve می‌کند و نسخه‌ی تازه‌ی
# یک وابستگیِ غیرمستقیم می‌تواند بیلد را بشکند بدونِ اینکه کدی عوض شده باشد.
dependency_overrides:
  # path_provider_android از 2.3.0 به `jni` وابسته شد و
  # `jni/android/build.gradle` متدِ `kotlin()` را صدا می‌زند که در پیکربندیِ
  # gradleِ ما وجود ندارد → «Could not find method kotlin()» و شکستِ
  # assembleRelease. 2.2.23 آخرین نسخه‌ی بدونِ jni است.
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
