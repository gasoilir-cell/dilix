name: Mobile — Build Android APK

# بیلدِ APK روی runnerِ ابری انجام می‌شود تا سرورِ تولید (که Android SDK/Flutter
# ندارد و نباید با ~۱۰GB تولچین سنگین شود) دست‌نخورده بماند.

on:
  push:
    branches: [main]
    paths:
      - "frontend/mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Base URL سرویسِ dilix-api (production) که APK به آن وصل می‌شود"
        required: true
        default: "http://185.55.226.250:8000"
        type: string

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # آخرین Flutterِ پایدار (بدونِ pinِ نسخهٔ ثابت) تا کدی که از APIهای جدیدترِ
      # Material (مثلِ CardThemeData، فقط از Flutter 3.27+) استفاده می‌کند کامپایل شود.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # اسکفولدِ android/ را کاملاً از صفر با خودِ Flutterِ نصب‌شده تولید می‌کنیم (نه صرفِ
      # patch رویِ نسخهٔ کامیت‌شده) تا هیچ فایلِ قدیمیِ Gradle/Groovy با فایل‌های جدیدِ
      # Kotlin-DSL (build.gradle.kts) که Flutterِ جدید تولید می‌کند تداخل نکند.
      - name: Regenerate Android scaffold (Flutter-matched Gradle/AGP/Kotlin)
        run: |
          rm -rf android
          flutter create --platforms=android --org com.dilix .

      # کلیدِ امضای پایدار (PKCS12، base64) از رازهای مخزن. اگر رازها تنظیم نشده
      # باشند این گام بی‌صدا رد می‌شود و بیلد مثلِ قبل با کلیدِ debug امضا می‌شود.
      # نسخهٔ اصل روی سرورِ تولید در /opt/dilix-keys نگهداری می‌شود (هرگز در گیت).
      - name: Install release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/dilix-release.p12
            echo "release keystore installed ($(stat -c%s android/app/dilix-release.p12) bytes)"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 تنظیم نشده — APK با کلیدِ debug امضا می‌شود و App Links تأیید نخواهد شد."
          fi

      # بازاعمالِ سفارشی‌سازی‌های Dilix که flutter create نمی‌داند: minSdk، مجوزِ اینترنت،
      # و placeholderِ appAuthRedirectScheme برای flutter_appauth (سینتکسِ Kotlin DSL).
      - name: Apply Dilix Android customizations
        run: |
          python3 - <<'PY'
          import re, pathlib

          gradle = pathlib.Path("android/app/build.gradle.kts")
          t = gradle.read_text()
          t = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 21", t)
          # flutter.compileSdkVersion برای این کانالِ Flutter روی ۳۱ resolve می‌شود، درحالی‌که
          # وابستگی‌های transitiveِ flutter_appauth/flutter_facebook_auth/flutter_secure_storage
          # حداقل compileSdk=36 می‌خواهند (خطای checkReleaseAarMetadata).
          t = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", t)
          if "manifestPlaceholders" not in t:
              t = t.replace(
                  "defaultConfig {",
                  'defaultConfig {\n        manifestPlaceholders["appAuthRedirectScheme"] = "app.dilix"',
                  1,
              )
          # ── امضای release با کلیدِ پایدار ─────────────────────────────────────
          # پیش از این هیچ signingConfigی نبود، پس Flutter نسخهٔ release را با
          # debug.keystoreِ خودِ runner امضا می‌کرد. آن کلید **هر اجرا از نو ساخته
          # می‌شود**، یعنی: (۱) App Links هرگز تأیید نمی‌شد چون اثرِ انگشت هر بار
          # عوض می‌شد، و (۲) نصبِ نسخهٔ تازه روی نسخهٔ قبلی با
          # INSTALL_FAILED_UPDATE_INCOMPATIBLE رد می‌شد و کاربر باید اول حذف می‌کرد.
          # کلیدِ واقعی از رازهای مخزن می‌آید؛ اگر تنظیم نشده باشند رفتارِ قبلی
          # (امضای debug) حفظ می‌شود تا بیلد قرمز نشود.
          # ⚠ گاردِ idempotency روی «dilix-release.p12» است نه «signingConfigs»:
          # قالبِ پیش‌فرضِ Flutter خودش signingConfigs.getByName("debug") را دارد،
          # پس آن شرط همیشه false می‌شد و امضا بی‌صدا اعمال نمی‌شد.
          if pathlib.Path("android/app/dilix-release.p12").exists() and "dilix-release.p12" not in t:
              signing = "\n".join([
                  'signingConfigs {',
                  '        create("release") {',
                  '            storeFile = file("dilix-release.p12")',
                  '            storeType = "PKCS12"',
                  '            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")',
                  '            keyAlias = System.getenv("ANDROID_KEYSTORE_ALIAS")',
                  '            keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")',
                  '        }',
                  '    }',
                  '',
                  '    buildTypes {',
              ])
              t = t.replace("buildTypes {", signing, 1)
              t = t.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
                  1,
              )
          gradle.write_text(t)

          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          if "android.permission.INTERNET" not in m:
              m = m.replace(
                  ">",
                  ">\n    <uses-permission android:name=\"android.permission.INTERNET\"/>",
                  1,
              )
          # سرورِ Coreِ فعلی روی http (بدونِ TLS) سرویس می‌دهد؛ Android از targetSdk 28
          # ترافیکِ cleartext را پیش‌فرض مسدود می‌کند، پس باید صریحاً مجاز شود وگرنه
          # login/register با خطای cleartext-not-permitted شکست می‌خورد.
          if "usesCleartextTraffic" not in m:
              m = m.replace("<application", "<application\n        android:usesCleartextTraffic=\"true\"", 1)

          # لینکِ عمیق: بدونِ این intent-filterها `dilix.ir/join?ref=…` (دعوت) و
          # `dilix.ir/pay/DLX-…` (پرداخت با لینک/QR) روی گوشی مرورگر را باز می‌کنند و
          # کاربر از اپ بیرون می‌افتد، با اینکه هر دو داخلِ اپ پیاده شده‌اند.
          # `flutter create` این‌ها را نمی‌سازد، پس مثلِ minSdk اینجا بازاعمال می‌شود.
          if 'android:scheme="dilix"' not in m:
              deep_links = """
            <intent-filter>
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <category android:name="android.intent.category.BROWSABLE"/>
                <data android:scheme="dilix"/>
            </intent-filter>
            <intent-filter android:autoVerify="true">
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <category android:name="android.intent.category.BROWSABLE"/>
                <data android:scheme="https"/>
                <data android:host="dilix.ir"/>
                <data android:pathPrefix="/join"/>
                <data android:pathPrefix="/pay/"/>
                <data android:pathPrefix="/earth"/>
            </intent-filter>
          </activity>"""
              m = m.replace("</activity>", deep_links, 1)
          manifest.write_text(m)

          # ── MainActivity باید FragmentActivity باشد ────────────────────────
          # پلاگینِ local_auth (قفلِ اثرِ انگشت) روی androidx BiometricPrompt سوار
          # است و آن فقط با FragmentActivity کار می‌کند؛ با FlutterActivityِ
          # پیش‌فرض، پرسشِ احراز در زمانِ اجرا با «no_fragment_activity» شکست
          # می‌خورد. `flutter create` همیشه نسخهٔ FlutterActivity را می‌سازد، پس
          # مثلِ minSdk اینجا بازنویسی می‌شود. با glob می‌گردیم تا به مسیرِ
          # دقیقِ پکیج (یا زبانِ Kotlin/Java) گره نخورد.
          acts = list(pathlib.Path("android/app/src/main").rglob("MainActivity.kt"))
          assert acts, "MainActivity.kt پیدا نشد"
          for act in acts:
              a = act.read_text()
              a = a.replace(
                  "import io.flutter.embedding.android.FlutterActivity",
                  "import io.flutter.embedding.android.FlutterFragmentActivity",
              ).replace(
                  "class MainActivity : FlutterActivity()",
                  "class MainActivity : FlutterFragmentActivity()",
              )
              act.write_text(a)
              print("--- MainActivity ---")
              print(a.strip())

          # پکیج‌هایی مثلِ flutter_appauth ماژولِ Androidِ خودشان را (داخلِ pub cache) با
          # compileSdk قدیمی (۳۱) منتشر کرده‌اند؛ عوض‌کردنِ compileSdk فقط در android/app کافی
          # نیست چون :flutter_appauth/:flutter_facebook_auth/:flutter_secure_storage هرکدام
          # ماژولِ Gradleِ جداگانه‌اند. با یک subprojects block در ریشه، compileSdk را روی همهٔ
          # ماژول‌های Android library (صرف‌نظر از مقدارِ داخلیِ خودشان) به ۳۶ force می‌کنیم.
          root_gradle = pathlib.Path("android/build.gradle.kts")
          rt = root_gradle.read_text()
          force_block = '''
          subprojects {
              if (project.name != "app") {
                  afterEvaluate {
                      extensions.findByType(com.android.build.gradle.LibraryExtension::class.java)?.compileSdk = 36
                  }
              }
          }
          '''
          if "com.android.build.gradle.LibraryExtension" not in rt:
              rt += force_block
          root_gradle.write_text(rt)

          print("--- build.gradle.kts defaultConfig ---")
          print("\n".join(l for l in gradle.read_text().splitlines() if "applicationId" in l or "minSdk" in l or "compileSdk" in l or "manifestPlaceholders" in l))
          print("--- manifest permission ---")
          print("\n".join(l for l in manifest.read_text().splitlines() if "uses-permission" in l))
          print("--- deep-link filters ---")
          print("\n".join(l.strip() for l in manifest.read_text().splitlines() if "android:scheme" in l or "pathPrefix" in l))
          PY

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      # تست‌های ویجت/واحد (مثلِ test/call_flow_test.dart و marketplace_screen_test.dart)
      # بدونِ نیاز به دستگاه/شبیه‌ساز روی همین runner اجرا می‌شوند و شکستشان بیلد را
      # متوقف می‌کند تا رگرسیونِ UI پیش از انتشارِ APK گرفته شود.
      - name: Run widget/unit tests
        run: flutter test

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          flutter build apk --release \
            --dart-define=DILIX_API_BASE_URL=${{ github.event.inputs.api_base_url || 'http://185.55.226.250:8000' }}

      # اثرِ انگشتِ گواهیِ APKِ ساخته‌شده باید **دقیقاً** با مقدارِ ANDROID_CERT_SHA256
      # در محیطِ وب (که /.well-known/assetlinks.json را می‌سازد) یکی باشد؛ وگرنه
      # اندروید App Link را تأیید نمی‌کند و لینک‌ها باز هم در مرورگر باز می‌شوند.
      - name: Print APK signer fingerprint
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | grep -i "SHA-256 digest\|Signer #1 certificate DN" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dilix-mobile-release-apk
          path: frontend/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
