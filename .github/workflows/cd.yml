name: CD — Build Image

# چرا اینجا فقط «build» هست و «deploy» نیست؟
#
# توپولوژیِ شبکه استقرار از GitHub Actions را *غیرممکن* می‌کند:
#   • runnerهای گیت‌هاب (بین‌المللی) به 185.55.226.250 نمی‌رسند — سرور فقط
#     ترافیکِ داخلیِ ایران را می‌پذیرد.
#   • خودِ سرور هم به github.com نمی‌رسد (تایم‌اوت).
# پس هیچ jobِ SSHای اینجا نمی‌تواند سبز شود، حتی با تعریفِ راز.
#
# jobهای قبلیِ `deploy-staging` و `deploy-production-ir` به همین دلیل حذف شدند:
# آن‌ها نه راز داشتند، نه environment، و روی هر push به main دستورِ
# `alembic upgrade head` را روی دیتابیس اجرا می‌کردند — یعنی مهاجرتِ خودکارِ
# دیتابیس بدونِ هیچ گاردِ انسانی.
#
# استقرارِ واقعی از همین محیطِ داخلی و دستی انجام می‌شود:
#   infra/deploy/deploy-api.sh   → سرویسِ زنده (backend/services/api)
#   infra/deploy/deploy-web.sh   → وبِ Next.js
#   infra/deploy/sync-apk.sh     → APK روی مسیرِ دانلود
#
# کارِ این workflow فقط یک چیز است: ثابت کند ایمیجِ core واقعاً build می‌شود
# و آن را روی ghcr منتشر کند.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "backend/services/core/**"
      - "backend/libs/shared/**"
      - ".dockerignore"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/dilix-core

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      # بدونِ این گام، درایورِ پیش‌فرضِ docker است و `cache-to: type=gha`
      # با «Cache export is not supported for the docker driver» شکست می‌خورد.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      # روی pull_request مخزن فقط خواندنی است، پس نه login می‌کنیم نه push.
      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠ زمینهٔ بیلد ریشهٔ مخزن است چون ایمیج به `backend/libs/shared` نیاز
      # دارد که بیرونِ پوشهٔ سرویس است. اندازهٔ زمینه با `.dockerignore` مهار شده.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/services/core/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
